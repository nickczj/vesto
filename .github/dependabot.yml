version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: Asia/Singapore
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    ignore:
      # 0.18.5 is the last npm release; SheetJS moved distribution. Keeping it
      # is a documented exception in scripts/audit-gate.mjs.
      - dependency-name: xlsx

  - package-ecosystem: docker
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: Asia/Singapore
    open-pull-requests-limit: 3

  - package-ecosystem: docker-compose
    directory: '/deploy'
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: Asia/Singapore
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: Asia/Singapore
    open-pull-requests-limit: 3
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
