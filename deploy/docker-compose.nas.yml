services:
  vesto-v2:
    # CI passes the commit tag. The fallback keeps the manual commands in
    # RUNBOOK.md working on a host whose .env does not carry the image ref.
    image: ${IMAGE_REPO:-ghcr.io/nickczj/vesto-v2}:${IMAGE_TAG:-main}
    restart: unless-stopped
    labels:
      # Private image deployed by CI with immutable sha tags; Diun cannot
      # authenticate and must not report it as an update failure.
      - "diun.enable=false"
    env_file:
      - ../.env
    environment:
      HOST: ${HOST:-0.0.0.0}
      PORT: ${APP_CONTAINER_PORT:-3000}
    ports:
      - "${APP_BIND_IP:-0.0.0.0}:${APP_PORT:-43000}:${APP_CONTAINER_PORT:-3000}"
    volumes:
      - ../data:/data
    networks:
      - vesto_shared
      - traefik
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Consistent daily snapshots. The app runs SQLite in WAL mode, so a plain
  # file copy of vesto-v2.db can be empty; this service uses SQLite's online
  # backup API and verifies each snapshot.
  backup:
    image: ${IMAGE_REPO}:${IMAGE_TAG}
    restart: unless-stopped
    labels:
      - "diun.enable=false"
    depends_on:
      vesto-v2:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      BACKUP_DATABASE_PATH: /data/vesto-v2.db
      BACKUP_DIR: /backups
    command: ["node", "/app/scripts/backup-db.mjs", "--watch"]
    volumes:
      - ../data:/data
      - ../backups:/backups

  # One valuation row per SGT day at 08:00. The app owns the valuation logic;
  # this sidecar only calls the authenticated /api/snapshots endpoint.
  snapshot:
    image: ${IMAGE_REPO}:${IMAGE_TAG}
    restart: unless-stopped
    labels:
      - "diun.enable=false"
    depends_on:
      vesto-v2:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      SNAPSHOT_APP_URL: http://vesto-v2:3000
      SNAPSHOT_HOUR_SGT: "8"
    command: ["node", "/app/scripts/valuation-snapshot.mjs", "--watch"]
    networks:
      - vesto_shared

  # Encrypted off-site copy of the snapshots in Cloudflare R2. It reads only
  # /backups: never the live database. Home Assistant watches it through the
  # webhook in deploy/offsite.sh; see deploy/RUNBOOK.md.
  offsite:
    image: restic/restic:0.19.1
    restart: unless-stopped
    env_file:
      - ../.env.offsite
    environment:
      BACKUP_DIR: /backups
      RESTIC_PASSWORD_FILE: /run/secrets/restic-password
      OFFSITE_INTERVAL_HOURS: "24"
    volumes:
      - ../backups:/backups:ro
      - ./restic-password:/run/secrets/restic-password:ro
      - ./offsite.sh:/usr/local/bin/offsite.sh:ro
    entrypoint: ["sh", "/usr/local/bin/offsite.sh"]

networks:
  vesto_shared:
    external: true
    name: ${SHARED_DOCKER_NETWORK:-vesto-shared}
  traefik:
    external: true
    name: traefik
